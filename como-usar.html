<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Como Usar · ReceitasX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode:"class",
            theme:{ extend:{ colors:{ primary:"#25f4f4","background-dark":"#121212","card-dark":"#1E1E1E","border-dark":"#2A2A2A" }, fontFamily:{ display:["Inter","sans-serif"] } } }
        }
    </script>
    <style>
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; vertical-align:middle; }

        .btn-back { display:flex;align-items:center;gap:.3rem;color:#94a3b8;font-size:.85rem;cursor:pointer;transition:color .15s;background:none;border:none;padding:0; }
        .btn-back:hover { color:#25f4f4; }

        /* hero */
        .hero-banner {
            background:linear-gradient(135deg,rgba(248,113,113,.08),rgba(248,113,113,.02));
            border:1px solid rgba(248,113,113,.15);border-radius:1rem;
            padding:1.5rem;text-align:center;
        }
        .hero-ico {
            width:3.5rem;height:3.5rem;border-radius:1rem;margin:0 auto .75rem;
            background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);
            display:flex;align-items:center;justify-content:center;
        }
        .hero-ico .material-symbols-outlined { font-size:1.8rem;color:#f87171;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24; }

        /* video card */
        .video-card {
            background:#1A1A1A;border:1px solid #2A2A2A;border-radius:1rem;
            overflow:hidden;transition:border-color .2s,box-shadow .2s;
        }
        .video-card:hover { border-color:rgba(248,113,113,.3);box-shadow:0 4px 24px rgba(0,0,0,.3); }

        .video-thumb {
            position:relative;width:100%;padding-bottom:56.25%;background:#111;
            cursor:pointer;overflow:hidden;
        }
        .video-thumb img {
            position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
            transition:transform .3s;
        }
        .video-card:hover .video-thumb img { transform:scale(1.03); }

        .play-overlay {
            position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            background:rgba(0,0,0,.35);transition:background .2s;
        }
        .video-card:hover .play-overlay { background:rgba(0,0,0,.2); }
        .play-btn {
            width:4rem;height:4rem;border-radius:50%;
            background:rgba(248,113,113,.9);backdrop-filter:blur(8px);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 4px 24px rgba(248,113,113,.4);
            transition:transform .2s;
        }
        .video-card:hover .play-btn { transform:scale(1.08); }
        .play-btn .material-symbols-outlined { font-size:2rem;color:#fff;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;margin-left:3px; }

        .video-info { padding:1rem 1.15rem; }
        .video-title { font-size:.95rem;font-weight:700;color:#f1f5f9;line-height:1.3; }
        .video-desc  { font-size:.78rem;color:#64748b;margin-top:.35rem;line-height:1.5; }

        .video-meta {
            display:flex;align-items:center;gap:.5rem;margin-top:.6rem;flex-wrap:wrap;
        }
        .meta-pill {
            display:inline-flex;align-items:center;gap:.2rem;
            font-size:.6rem;font-weight:600;padding:.15rem .5rem;
            border-radius:9999px;background:rgba(248,113,113,.08);
            border:1px solid rgba(248,113,113,.15);color:#f87171;
        }
        .meta-pill .material-symbols-outlined { font-size:.7rem; }

        /* shimmer */
        .shimmer { background:linear-gradient(90deg,#1A1A1A 25%,#222 50%,#1A1A1A 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:1rem; }
        @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }

        /* empty */
        .empty-state { text-align:center;padding:4rem 1rem;color:#475569; }
        .empty-state .material-symbols-outlined { font-size:4rem;color:#2A2A2A;display:block;margin-bottom:.75rem; }

        /* modal video player */
        #player-overlay {
            position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
            z-index:9999;display:none;align-items:center;justify-content:center;padding:1rem;
        }
        #player-overlay.show { display:flex; }
        #player-wrap {
            width:100%;max-width:900px;border-radius:1rem;overflow:hidden;
            box-shadow:0 16px 64px rgba(0,0,0,.8);
            animation:_playerSlide .35s cubic-bezier(.34,1.56,.64,1);
            position:relative;
        }
        @keyframes _playerSlide { from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)} }
        #player-wrap iframe {
            width:100%;aspect-ratio:16/9;border:none;display:block;
        }
        .player-close {
            position:absolute;top:.75rem;right:.75rem;z-index:10;
            width:2.2rem;height:2.2rem;border-radius:50%;
            background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);
            display:flex;align-items:center;justify-content:center;
            cursor:pointer;transition:all .15s;
        }
        .player-close:hover { background:rgba(248,113,113,.3);border-color:rgba(248,113,113,.4); }
        .player-close .material-symbols-outlined { font-size:1.1rem;color:#fff; }

        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen pb-24">

<!-- ══ Header ══════════════════════════════════════════════════════ -->
<header class="sticky top-0 z-20 bg-background-dark/90 backdrop-blur border-b border-border-dark">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center gap-3">
        <button class="btn-back" onclick="history.back()">
            <span class="material-symbols-outlined" style="font-size:1.25rem">arrow_back</span>
        </button>
        <h1 class="text-base font-semibold flex-1">Como Usar</h1>
    </div>
</header>

<!-- ══ Main ═════════════════════════════════════════════════════════ -->
<main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Hero -->
    <div class="hero-banner">
        <div class="hero-ico">
            <span class="material-symbols-outlined">play_circle</span>
        </div>
        <h2 style="font-size:1.1rem;font-weight:800;color:#f1f5f9;margin-bottom:.25rem">Tutoriais em Vídeo</h2>
        <p style="font-size:.82rem;color:#64748b;max-width:400px;margin:0 auto">Aprenda a usar todas as funcionalidades do ReceitasX com nossos vídeos passo a passo.</p>
    </div>

    <!-- Lista de vídeos -->
    <div id="videos-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- carregado por JS -->
    </div>

</main>

<!-- ══ Player Modal ════════════════════════════════════════════════ -->
<div id="player-overlay" onclick="fecharPlayer(event)">
    <div id="player-wrap" onclick="event.stopPropagation()">
        <button class="player-close" onclick="fecharPlayer()">
            <span class="material-symbols-outlined">close</span>
        </button>
        <iframe id="player-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
</div>

<script>
// ── Carregar tutoriais ────────────────────────────────────────────
(async () => {
    showLoading();
    try {
        const { data: tutoriais, error } = await sb
            .from('tutoriais')
            .select('*')
            .eq('ativo', true)
            .order('ordem', { ascending: true });

        if (error) throw error;
        renderVideos(tutoriais || []);
    } catch (e) {
        console.error('Erro ao carregar tutoriais:', e);
        document.getElementById('videos-grid').innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <span class="material-symbols-outlined">error</span>
                <p>Erro ao carregar tutoriais.</p>
            </div>`;
    }
})();

function extractYouTubeId(url) {
    if (!url) return null;
    // Suporta: youtube.com/watch?v=ID, youtu.be/ID, youtube.com/embed/ID, youtube.com/shorts/ID
    const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
        /^([a-zA-Z0-9_-]{11})$/,
    ];
    for (const p of patterns) {
        const m = url.match(p);
        if (m) return m[1];
    }
    return null;
}

function renderVideos(list) {
    const el = document.getElementById('videos-grid');

    if (!list.length) {
        el.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <span class="material-symbols-outlined">videocam_off</span>
                <p style="font-size:.95rem;font-weight:600">Nenhum tutorial disponível ainda</p>
                <p style="font-size:.78rem;margin-top:.25rem">Em breve teremos vídeos aqui para te ajudar!</p>
            </div>`;
        return;
    }

    el.innerHTML = list.map((t, i) => {
        const videoId = extractYouTubeId(t.youtube_url);
        const thumb = videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : '';
        const idx = i + 1;

        return `
        <div class="video-card" style="animation:fadeUp .3s ease both;animation-delay:${i * 0.08}s">
            <div class="video-thumb" onclick="abrirPlayer('${videoId}')">
                ${thumb ? `<img src="${thumb}" alt="${esc(t.titulo)}" loading="lazy" />` : ''}
                <div class="play-overlay">
                    <div class="play-btn">
                        <span class="material-symbols-outlined">play_arrow</span>
                    </div>
                </div>
            </div>
            <div class="video-info">
                <div class="video-title">${esc(t.titulo)}</div>
                ${t.descricao ? `<div class="video-desc">${esc(t.descricao)}</div>` : ''}
                <div class="video-meta">
                    <span class="meta-pill">
                        <span class="material-symbols-outlined">play_circle</span>
                        Vídeo ${idx}
                    </span>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ── Player ────────────────────────────────────────────────────────
function abrirPlayer(videoId) {
    if (!videoId) return;
    document.getElementById('player-iframe').src =
        `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    document.getElementById('player-overlay').classList.add('show');
}

function fecharPlayer(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('player-iframe').src = '';
    document.getElementById('player-overlay').classList.remove('show');
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') fecharPlayer();
});

// ── Shimmer ────────────────────────────────────────────────────────
function showLoading() {
    document.getElementById('videos-grid').innerHTML =
        Array(4).fill('<div class="shimmer" style="height:16rem"></div>').join('');
}

function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
