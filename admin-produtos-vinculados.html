<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Produtos Vinculados - Admin · ReceitasX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary:"#25f4f4","background-dark":"#121212","card-dark":"#1E1E1E","border-dark":"#2A2A2A" }, fontFamily:{ display:["Inter","sans-serif"] } } }
        }
    </script>
    <style>
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; vertical-align:middle; }

        .btn-back { display:flex;align-items:center;gap:.3rem;color:#94a3b8;font-size:.85rem;cursor:pointer;transition:color .15s;background:none;border:none;padding:0; }
        .btn-back:hover { color:#25f4f4; }
        .badge-admin { display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;font-weight:700;padding:.2rem .55rem;border-radius:.4rem;background:rgba(251,146,60,.12);color:#fb923c;border:1px solid rgba(251,146,60,.25); }

        .search-wrap { position:relative; }
        .search-wrap .ico { position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:#475569;font-size:1.1rem; }
        .search-input { width:100%;padding:.7rem .9rem .7rem 2.6rem;border-radius:.75rem;border:1px solid #2A2A2A;background:#1A1A1A !important;color:#f1f5f9 !important;font-size:.9rem;outline:none;transition:border-color .2s; }
        .search-input::placeholder { color:#475569 !important; }
        .search-input:focus { border-color:rgba(37,244,244,.4) !important;box-shadow:0 0 0 3px rgba(37,244,244,.07) !important; }

        .stat-card { background:#1A1A1A;border:1px solid #2A2A2A;border-radius:.85rem;padding:1rem 1.1rem; }
        .stat-val { font-size:1.6rem;font-weight:800;color:#f1f5f9;line-height:1; }
        .stat-lbl { font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#475569;margin-top:.25rem; }

        .user-group { background:#1A1A1A;border:1px solid #2A2A2A;border-radius:.85rem;overflow:hidden;margin-bottom:1rem;transition:border-color .15s; }
        .user-group:hover { border-color:rgba(37,244,244,.2); }
        .user-group-head { display:flex;align-items:center;gap:.85rem;padding:1rem 1.15rem;border-bottom:1px solid #222;cursor:pointer; }
        .user-group-head.collapsed .chevron { transform:rotate(-90deg); }
        .chevron { transition:transform .2s;color:#475569;font-size:1.1rem; }

        .avatar { width:2.5rem;height:2.5rem;border-radius:50%;background:linear-gradient(135deg,rgba(37,244,244,.25),rgba(37,244,244,.05));border:1px solid rgba(37,244,244,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem;font-weight:700;color:#25f4f4;text-transform:uppercase; }
        .user-info { flex:1;min-width:0; }
        .user-name { font-size:.9rem;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .user-email { font-size:.72rem;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }

        .count-badge { display:inline-flex;align-items:center;gap:.25rem;padding:.25rem .65rem;border-radius:9999px;font-size:.7rem;font-weight:800;background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.25); }

        .product-list { padding:0 1.15rem 1rem; }
        .product-row { display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-bottom:1px solid #1a1a1a; }
        .product-row:last-child { border-bottom:none; }

        .link-icon { width:1.8rem;height:1.8rem;border-radius:.45rem;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
        .link-icon .material-symbols-outlined { font-size:.95rem;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }

        .product-info { flex:1;min-width:0; }
        .product-name { font-size:.82rem;font-weight:700;color:#f1f5f9; }
        .product-recipe { font-size:.7rem;color:#64748b;margin-top:.1rem;display:flex;align-items:center;gap:.25rem; }
        .product-recipe .material-symbols-outlined { font-size:.75rem;color:#25f4f4; }

        .price-col { text-align:right;flex-shrink:0; }
        .price-venda { font-size:.82rem;font-weight:800;color:#34d399; }
        .price-custo { font-size:.65rem;color:#64748b;margin-top:.1rem; }

        .admin-banner { display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;background:rgba(37,244,244,.05);border:1px solid rgba(37,244,244,.2);border-radius:.75rem;font-size:.78rem;color:#25f4f4;margin-bottom:1.25rem; }
        .admin-banner .material-symbols-outlined { font-size:1rem;flex-shrink:0; }

        .empty-state { text-align:center;padding:4rem 1rem;color:#475569; }
        .empty-state .material-symbols-outlined { font-size:3rem;color:#2A2A2A;margin-bottom:.5rem; }

        .skeleton { background:linear-gradient(90deg,#1A1A1A 25%,#222 50%,#1A1A1A 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:.5rem; }
        @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    </style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen pb-24">

<header class="sticky top-0 z-20 bg-background-dark/90 backdrop-blur border-b border-border-dark">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center gap-3">
        <button class="btn-back" onclick="history.back()">
            <span class="material-symbols-outlined" style="font-size:1.25rem">arrow_back</span>
        </button>
        <span class="material-symbols-outlined" style="color:#34d399;font-size:1.1rem;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">link</span>
        <h1 class="text-base font-semibold flex-1">Produtos Vinculados</h1>
        <span id="admin-badge" class="badge-admin" style="display:none">
            <span class="material-symbols-outlined">verified</span>
            Admin
        </span>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6 space-y-5">
    <div class="admin-banner">
        <span class="material-symbols-outlined">link</span>
        <span>Usuários que vincularam pelo menos um produto a uma receita. Execute o script <strong>rpc_admin_produtos_vinculados.sql</strong> no Supabase.</span>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stats-row">
        <div class="stat-card">
            <div class="stat-val" id="stat-users">—</div>
            <div class="stat-lbl">Usuários</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-produtos" style="color:#34d399">—</div>
            <div class="stat-lbl">Produtos vinculados</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-receitas" style="color:#25f4f4">—</div>
            <div class="stat-lbl">Receitas usadas</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-media" style="color:#fbbf24">—</div>
            <div class="stat-lbl">Média por usuário</div>
        </div>
    </div>

    <div class="search-wrap flex-1 w-full">
        <span class="material-symbols-outlined ico">search</span>
        <input id="search" class="search-input" type="text" placeholder="Buscar por nome ou e-mail…" oninput="filterList()" />
    </div>

    <div id="main-list">
        <div class="skeleton" style="height:5rem;margin-bottom:.75rem"></div>
        <div class="skeleton" style="height:5rem;margin-bottom:.75rem"></div>
        <div class="skeleton" style="height:5rem;margin-bottom:.75rem"></div>
    </div>
</main>

<script>
let allGrouped = [];
let perfisMap = {};
let emailsMap = {};

(async () => {
    await _waitForRole(4000);
    if (window.__userRole !== 'admin') {
        document.body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;color:#f1f5f9"><span class="material-symbols-outlined" style="font-size:3rem;color:#f87171">block</span><h1 style="font-size:1.2rem;font-weight:700">Acesso Negado</h1></div>`;
        return;
    }
    document.getElementById('admin-badge').style.display = '';
    loadDados();
})();

async function loadDados() {
    try {
        // 1. Perfis
        const { data: perfis } = await sb.from('perfis').select('id, nome, sobrenome, created_at').order('created_at', { ascending: false });
        (perfis || []).forEach(p => perfisMap[p.id] = p);

        // 2. Emails
        try {
            const resp = await fetch('https://pipknmwjpblitqlxxdcw.supabase.co/functions/v1/list-users', {
                headers: { 'Authorization': `Bearer ${(await sb.auth.getSession()).data.session?.access_token}` }
            });
            if (resp.ok) {
                const body = await resp.json();
                (body.users || []).forEach(u => emailsMap[u.id] = u.email);
            }
        } catch(_) {}

        // 3. RPC
        const { data: rpcData, error } = await sb.rpc('admin_produtos_vinculados');

        if (error) {
            if (error.code === 'PGRST202') {
                throw new Error("Função 'admin_produtos_vinculados' não encontrada. Execute o SQL.");
            }
            throw error;
        }

        // Agrupar por user_id
        const groups = {};
        (rpcData || []).forEach(r => {
            if (!groups[r.user_id]) {
                groups[r.user_id] = {
                    user_id: r.user_id,
                    produtos: [],
                    receitas_set: new Set()
                };
            }
            groups[r.user_id].produtos.push(r);
            groups[r.user_id].receitas_set.add(r.receita_id);
        });

        allGrouped = Object.values(groups).map(g => {
            const p = perfisMap[g.user_id] || {};
            return {
                ...g,
                nome: p.nome,
                sobrenome: p.sobrenome,
                email: emailsMap[g.user_id] || '--',
                qtd_produtos: g.produtos.length,
                qtd_receitas: g.receitas_set.size
            };
        });

        // Ordenar por quantidade (maiores primeiro)
        allGrouped.sort((a, b) => b.qtd_produtos - a.qtd_produtos);

        updateStats(rpcData || []);
        filterList();

    } catch (e) {
        document.getElementById('main-list').innerHTML = `
            <div style="text-align:center;padding:3rem 1rem;color:#f87171;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:.85rem;">
                <span class="material-symbols-outlined" style="font-size:3rem;margin-bottom:.5rem;">error</span>
                <p style="font-weight:600">Erro ao carregar dados</p>
                <p style="font-size:.85rem;margin-top:.5rem;color:#94a3b8;">${e.message}</p>
            </div>
        `;
    }
}

function updateStats(all) {
    const uniqueUsers = new Set(all.map(r => r.user_id));
    const uniqueReceitas = new Set(all.map(r => r.receita_id));
    const media = uniqueUsers.size > 0 ? (all.length / uniqueUsers.size).toFixed(1) : '0';

    document.getElementById('stat-users').textContent = uniqueUsers.size;
    document.getElementById('stat-produtos').textContent = all.length;
    document.getElementById('stat-receitas').textContent = uniqueReceitas.size;
    document.getElementById('stat-media').textContent = media;
}

function filterList() {
    const q = (document.getElementById('search').value || '').toLowerCase().trim();
    let res = allGrouped;
    if (q) {
        res = res.filter(g => {
            const name = ((g.nome||'') + ' ' + (g.sobrenome||'')).toLowerCase();
            return name.includes(q) || (g.email||'').toLowerCase().includes(q);
        });
    }
    renderList(res);
}

function renderList(list) {
    const el = document.getElementById('main-list');

    if (!list.length) {
        el.innerHTML = `
            <div class="empty-state">
                <span class="material-symbols-outlined">link_off</span>
                <p style="font-size:.88rem;font-weight:600">Nenhum resultado</p>
                <p style="font-size:.78rem;margin-top:.3rem">Nenhum usuário vinculou produtos a receitas ainda.</p>
            </div>`;
        return;
    }

    el.innerHTML = list.map((g, idx) => {
        const initials = ((g.nome||'?')[0] || '') + ((g.sobrenome||'')[0] || '');
        const fullName = [g.nome, g.sobrenome].filter(Boolean).join(' ') || 'Sem Nome';

        const prodRows = g.produtos.map(p => {
            const margem = p.produto_preco > 0 && p.produto_custo > 0
                ? (((p.produto_preco - p.produto_custo) / p.produto_preco) * 100).toFixed(0)
                : null;
            const margemColor = margem !== null ? (margem >= 50 ? '#34d399' : margem >= 30 ? '#fbbf24' : '#f87171') : '#475569';
            const dt = new Date(p.produto_created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });

            return `
            <div class="product-row">
                <div class="link-icon" style="background:rgba(52,211,153,.1)">
                    <span class="material-symbols-outlined" style="color:#34d399">link</span>
                </div>
                <div class="product-info">
                    <div class="product-name">${esc(p.produto_nome)}</div>
                    <div class="product-recipe">
                        <span class="material-symbols-outlined">menu_book</span>
                        ${esc(p.receita_nome)} · ${p.receita_unidades || 1} un · Custo R$ ${fmtR(p.receita_custo_total)}
                    </div>
                </div>
                <div class="price-col">
                    <div class="price-venda">R$ ${fmtR(p.produto_preco)}</div>
                    <div class="price-custo">Custo R$ ${fmtR(p.produto_custo)} ${margem !== null ? `· <span style="color:${margemColor};font-weight:700">${margem}%</span>` : ''}</div>
                </div>
            </div>`;
        }).join('');

        return `
        <div class="user-group" id="group-${idx}">
            <div class="user-group-head" onclick="toggleGroup(${idx})">
                <div class="avatar">${initials.toUpperCase()}</div>
                <div class="user-info">
                    <div class="user-name">${esc(fullName)}</div>
                    <div class="user-email">${esc(g.email)}</div>
                </div>
                <div class="count-badge">
                    <span class="material-symbols-outlined" style="font-size:.75rem">link</span>
                    ${g.qtd_produtos} produto${g.qtd_produtos > 1 ? 's' : ''} · ${g.qtd_receitas} receita${g.qtd_receitas > 1 ? 's' : ''}
                </div>
                <span class="material-symbols-outlined chevron">expand_more</span>
            </div>
            <div class="product-list" id="products-${idx}">
                ${prodRows}
            </div>
        </div>`;
    }).join('');
}

function toggleGroup(idx) {
    const head = document.querySelector(`#group-${idx} .user-group-head`);
    const body = document.getElementById(`products-${idx}`);
    const isCollapsed = head.classList.toggle('collapsed');
    body.style.display = isCollapsed ? 'none' : '';
}

function fmtR(v) {
    return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
