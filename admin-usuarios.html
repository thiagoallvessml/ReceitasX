<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Painel Admin - ReceitasX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary:"#25f4f4","background-dark":"#121212","card-dark":"#1E1E1E","border-dark":"#2A2A2A" }, fontFamily:{ display:["Inter","sans-serif"] } } }
        }
    </script>
    <style>
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; vertical-align:middle; }

        /* btn back */
        .btn-back { display:flex;align-items:center;gap:.3rem;color:#94a3b8;font-size:.85rem;cursor:pointer;transition:color .15s;background:none;border:none;padding:0; }
        .btn-back:hover { color:#25f4f4; }

        /* badge role */
        .badge-admin    { display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;font-weight:700;padding:.2rem .55rem;border-radius:.4rem;background:rgba(251,146,60,.12);color:#fb923c;border:1px solid rgba(251,146,60,.25); }
        .badge-afiliado { display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;font-weight:700;padding:.2rem .55rem;border-radius:.4rem;background:rgba(37,244,244,.1);color:#25f4f4;border:1px solid rgba(37,244,244,.25); }
        .badge-admin .material-symbols-outlined,
        .badge-afiliado .material-symbols-outlined { font-size:.75rem; }

        /* user card */
        .user-card { display:flex;align-items:center;gap:.85rem;padding:.9rem 1rem;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:.85rem;transition:border-color .15s; }
        .user-card:hover { border-color:rgba(37,244,244,.2); }
        .avatar { width:2.5rem;height:2.5rem;border-radius:50%;background:linear-gradient(135deg,rgba(37,244,244,.25),rgba(37,244,244,.05));border:1px solid rgba(37,244,244,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem;font-weight:700;color:#25f4f4;text-transform:uppercase; }
        .user-info { flex:1;min-width:0; }
        .user-name { font-size:.9rem;font-weight:600;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .user-email { font-size:.72rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .user-meta { font-size:.78rem;color:#64748b;margin-top:.2rem; }

        /* role select */
        .role-sel { padding:.35rem .6rem;border-radius:.5rem;border:1px solid #2A2A2A;background:#141414;color:#f1f5f9;font-size:.78rem;font-weight:600;cursor:pointer;outline:none;transition:border-color .2s; }
        .role-sel:focus { border-color:rgba(37,244,244,.5); }

        /* search */
        .search-wrap { position:relative; }
        .search-wrap .ico { position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:#475569;font-size:1.1rem; }
        .search-input { width:100%;padding:.7rem .9rem .7rem 2.6rem;border-radius:.75rem;border:1px solid #2A2A2A;background:#1A1A1A !important;color:#f1f5f9 !important;font-size:.9rem;outline:none;transition:border-color .2s; }
        .search-input::placeholder { color:#475569 !important; }
        .search-input:focus { border-color:rgba(37,244,244,.4) !important;box-shadow:0 0 0 3px rgba(37,244,244,.07) !important; }

        input,select { background-color:#1A1A1A !important; color:#f1f5f9 !important; border-color:#2A2A2A !important; }
        input::placeholder { color:#475569 !important; }

        /* filter pill */
        .pill { padding:.35rem .85rem;border-radius:9999px;border:1px solid #2A2A2A;background:transparent;color:#64748b;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s; }
        .pill.active { background:rgba(37,244,244,.1);border-color:rgba(37,244,244,.4);color:#25f4f4; }
        .pill:hover:not(.active) { border-color:#475569;color:#94a3b8; }

        /* stats card */
        .stat-card { background:#1A1A1A;border:1px solid #2A2A2A;border-radius:.85rem;padding:1rem 1.1rem; }
        .stat-val { font-size:1.6rem;font-weight:800;color:#f1f5f9;line-height:1; }
        .stat-lbl { font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#475569;margin-top:.25rem; }

        /* toast */
        #toast { position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#1E1E1E;border:1px solid rgba(37,244,244,.35);color:#f1f5f9;padding:.65rem 1.2rem;border-radius:.75rem;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:.5rem;z-index:200;opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;box-shadow:0 8px 32px rgba(0,0,0,.5);white-space:nowrap; }
        #toast.show { transform:translateX(-50%) translateY(0);opacity:1; }

        /* empty state */
        .empty { text-align:center;padding:3rem 1rem;color:#475569; }
        .empty .material-symbols-outlined { font-size:3rem;color:#2A2A2A;display:block;margin-bottom:.75rem; }

        /* loading shimmer */
        .shimmer { background:linear-gradient(90deg,#1A1A1A 25%,#222 50%,#1A1A1A 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:.65rem;height:4.2rem; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* admin-only banner */
        .admin-banner { display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;background:rgba(251,146,60,.05);border:1px solid rgba(251,146,60,.2);border-radius:.75rem;font-size:.78rem;color:#fb923c;margin-bottom:1.25rem; }
        .admin-banner .material-symbols-outlined { font-size:1rem;flex-shrink:0; }

        /* badge vitalicio */
        .badge-vital { display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;font-weight:700;padding:.2rem .55rem;border-radius:.4rem;background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.3); }
        .badge-vital .material-symbols-outlined { font-size:.75rem; }
    </style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen pb-24">

<!-- ══ Header ════════════════════════════════════════════════════ -->
<header class="sticky top-0 z-20 bg-background-dark/90 backdrop-blur border-b border-border-dark">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center gap-3">
        <button class="btn-back" onclick="history.back()">
            <span class="material-symbols-outlined" style="font-size:1.25rem">arrow_back</span>
        </button>
        <span class="material-symbols-outlined text-orange-400" style="font-size:1.1rem;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">shield</span>
        <h1 class="text-base font-semibold flex-1">Painel Admin</h1>
        <span id="admin-badge" class="badge-admin" style="display:none">
            <span class="material-symbols-outlined">verified</span>
            Admin
        </span>
    </div>
</header>

<!-- ══ Main ═══════════════════════════════════════════════════════ -->
<main class="max-w-4xl mx-auto px-4 py-6 space-y-5">

    <!-- Banner de acesso restrito -->
    <div class="admin-banner">
        <span class="material-symbols-outlined">lock</span>
        <span>Área restrita aos administradores do ReceitasX. Aqui você pode gerenciar os roles de todos os usuários.</span>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3" id="stats-row">
        <div class="stat-card">
            <div class="stat-val" id="stat-total">—</div>
            <div class="stat-lbl">Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-gratuito" style="color:#94a3b8">—</div>
            <div class="stat-lbl">Gratuito</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-vitalicio" style="color:#34d399">—</div>
            <div class="stat-lbl">Vitálicio</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-pagantes" style="color:#a78bfa">—</div>
            <div class="stat-lbl">Pagantes</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-admin" style="color:#fb923c">—</div>
            <div class="stat-lbl">Admins</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-afiliado" style="color:#25f4f4">—</div>
            <div class="stat-lbl">Afiliados</div>
        </div>
    </div>

    <!-- Search + filtro -->
    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
        <div class="search-wrap flex-1 w-full">
            <span class="material-symbols-outlined ico">search</span>
            <input id="search" class="search-input" type="text" placeholder="Buscar por nome ou e-mail…" oninput="filterUsuarios()" />
        </div>
        <div class="flex gap-2 flex-shrink-0 flex-wrap">
            <button class="pill active" data-filter="todos"    onclick="setFilter('todos', this)">Todos</button>
            <button class="pill" data-filter="pagantes"        onclick="setFilter('pagantes', this)">Pagantes</button>
            <button class="pill" data-filter="admin"          onclick="setFilter('admin', this)">Admin</button>
            <button class="pill" data-filter="afiliado"       onclick="setFilter('afiliado', this)">Afiliado</button>
        </div>
    </div>

    <!-- Lista de usuários -->
    <div id="user-list" class="space-y-2"></div>

</main>

<!-- ══ Toast ════════════════════════════════════════════════════ -->
<div id="toast" role="status">
    <span id="toast-icon" class="material-symbols-outlined" style="font-size:1rem;color:#25f4f4">check_circle</span>
    <span id="toast-msg">Role atualizado!</span>
</div>

<!-- ══ Script ═══════════════════════════════════════════════════ -->
<script>
let allUsuarios = [];
let emailsMap   = {};   // user_id → email
let pagantesSet = new Set(); // emails de quem pagou
let currentFilter = 'todos';

// ── Guard: só admin pode acessar ───────────────────────────────────
(async () => {
    await _waitForRole(4000);

    if (window.__userRole !== 'admin') {
        document.body.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;color:#f1f5f9;font-family:Inter,sans-serif">
                <span class="material-symbols-outlined" style="font-size:3rem;color:#f87171">block</span>
                <h1 style="font-size:1.2rem;font-weight:700">Acesso Negado</h1>
                <p style="color:#64748b;font-size:.9rem">Você não tem permissão para acessar esta página.</p>
                <a href="index.html" style="margin-top:.5rem;padding:.6rem 1.4rem;border-radius:.65rem;background:rgba(37,244,244,.1);border:1px solid rgba(37,244,244,.3);color:#25f4f4;font-weight:700;font-size:.85rem;text-decoration:none">Voltar ao início</a>
            </div>`;
        return;
    }

    document.getElementById('admin-badge').style.display = '';
    loadUsuarios();
})();

// ── Carregar usuários ─────────────────────────────────────────────────────
let _allEmails = []; // lista de {id, email} carregada do edge
async function loadUsuarios() {
    showLoading();
    try {
        // 1. Perfis do Supabase (inclui plano_ativo_em para detectar vitalício)
        const { data, error } = await sb
            .from('perfis')
            .select('id, nome, sobrenome, telefone, negocio, plano, plano_ativo_em, role, created_at')
            .order('created_at', { ascending: false });
        if (error) throw error;
        allUsuarios = data || [];

        // 2. Emails: busca via Edge Function listUsers (service-role)
        try {
            const resp = await fetch(
                'https://pipknmwjpblitqlxxdcw.supabase.co/functions/v1/list-users',
                { headers: { 'Authorization': `Bearer ${(await sb.auth.getSession()).data.session?.access_token}` } }
            );
            if (resp.ok) {
                const body = await resp.json();
                (body.users || []).forEach(u => { emailsMap[u.id] = u.email; });
            }
        } catch(_) {}

        // 3. Pagantes via tabela pedidos (complemento — pode ser bloqueado por RLS se policy admin não existir)
        //    SOLUÇÃO PRINCIPAL: usar plano='vitalicio' direto da tabela perfis (sempre funciona para admin)
        try {
            const { data: peds, error: pedErr } = await sb
                .from('pedidos')
                .select('email, user_id, status')
                .eq('status', 'pago');
            if (!pedErr && peds?.length) {
                pagantesSet = new Set(
                    peds.flatMap(p => [p.email?.toLowerCase(), p.user_id].filter(Boolean))
                );
            }
        } catch(_) {}

        // Marca _pagante usando AMBAS as fontes:
        // • plano = 'vitalicio' na tabela perfis  ← fonte primária (sempre disponível para admin)
        // • email ou user_id encontrado em pedidos ← complemento
        allUsuarios.forEach(u => {
            const email = (emailsMap[u.id] || '').toLowerCase();
            if (u.plano === 'vitalicio' ||
                pagantesSet.has(email) ||
                pagantesSet.has(u.id)) {
                u._pagante = true;
            }
        });

        updateStats();
        filterUsuarios();
    } catch (e) {
        console.error('Erro ao carregar usuários', e);
        document.getElementById('user-list').innerHTML = `
            <div class="empty">
                <span class="material-symbols-outlined">error</span>
                <p>Erro ao carregar usuários.<br><small>${e.message}</small></p>
            </div>`;
    }
}

// ── Stats ──────────────────────────────────────────────────────────────
function updateStats() {
    document.getElementById('stat-total').textContent    = allUsuarios.length;
    document.getElementById('stat-gratuito').textContent = allUsuarios.filter(u => !u._pagante).length;
    document.getElementById('stat-vitalicio').textContent= allUsuarios.filter(u => u.plano === 'vitalicio').length;
    document.getElementById('stat-pagantes').textContent = allUsuarios.filter(u => u._pagante).length;
    document.getElementById('stat-admin').textContent    = allUsuarios.filter(u => u.role === 'admin').length;
    document.getElementById('stat-afiliado').textContent = allUsuarios.filter(u => u.role === 'afiliado').length;
}

// ── Filtro + busca ────────────────────────────────────────────────
function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    filterUsuarios();
}

function filterUsuarios() {
    const q = (document.getElementById('search').value || '').toLowerCase().trim();

    let list = allUsuarios;

    if (currentFilter === 'pagantes') {
        list = list.filter(u => u._pagante);
    } else if (currentFilter !== 'todos') {
        list = list.filter(u => u.role === currentFilter);
    }

    if (q) {
        list = list.filter(u => {
            const nome  = ((u.nome || '') + ' ' + (u.sobrenome || '')).toLowerCase();
            const neg   = (u.negocio || '').toLowerCase();
            const email = (emailsMap[u.id] || '').toLowerCase();
            return nome.includes(q) || neg.includes(q) || email.includes(q);
        });
    }

    renderUsuarios(list);
}

// ── Render ──────────────────────────────────────────────────────────────
function renderUsuarios(list) {
    const el = document.getElementById('user-list');

    if (!list.length) {
        el.innerHTML = `
            <div class="empty">
                <span class="material-symbols-outlined">person_search</span>
                <p>Nenhum usuário encontrado.</p>
            </div>`;
        return;
    }

    el.innerHTML = list.map(u => {
        const initials    = getInitials(u.nome, u.sobrenome);
        const nomeCompleto = [u.nome, u.sobrenome].filter(Boolean).join(' ') || 'Sem nome';
        const criadoEm   = new Date(u.created_at).toLocaleDateString('pt-BR');
        const emailExib  = esc(emailsMap[u.id] || '—');
        const planoLabel = u._pagante ? 'Vitálicio' : (u.plano || 'gratuito');

        const roleBadge = u.role === 'admin'
            ? `<span class="badge-admin"><span class="material-symbols-outlined">shield</span>Admin</span>`
            : `<span class="badge-afiliado"><span class="material-symbols-outlined">person</span>Afiliado</span>`;

        const vitalBadge = u._pagante
            ? `<span class="badge-vital"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 700,'GRAD' 0,'opsz' 24">workspace_premium</span>Vitálicio</span>`
            : '';

        return `
        <div class="user-card" id="card-${u.id}">
            <div class="avatar">${initials}</div>
            <div class="user-info">
                <div class="user-name">${esc(nomeCompleto)}</div>
                <div class="user-email">${emailExib}</div>
                <div class="user-meta">${esc(u.negocio || '—')} · Desde ${criadoEm}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;flex-shrink:0">
                <div style="display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end">
                    ${vitalBadge}
                    ${roleBadge}
                </div>
                <select class="role-sel" id="sel-${u.id}"
                    onchange="changeRole('${u.id}', this.value)"
                    ${u.id === window.__userProfile?.id ? 'title="Não é possível alterar seu próprio role"' : ''}>
                    <option value="afiliado" ${u.role === 'afiliado' ? 'selected' : ''}>Afiliado</option>
                    <option value="admin"    ${u.role === 'admin'    ? 'selected' : ''}>Admin</option>
                </select>
            </div>
        </div>`;
    }).join('');
}

// ── Alterar role ──────────────────────────────────────────────────
async function changeRole(userId, novoRole) {
    // Impede admin de retirar o próprio role
    if (userId === window.__userProfile?.id && novoRole !== 'admin') {
        showToast('Você não pode remover seu próprio role Admin.', 'error');
        // Reverter select
        document.getElementById(`sel-${userId}`).value = 'admin';
        return;
    }

    try {
        const { error } = await sb
            .from('perfis')
            .update({ role: novoRole })
            .eq('id', userId);

        if (error) throw error;

        // Atualiza localmente
        const u = allUsuarios.find(x => x.id === userId);
        if (u) u.role = novoRole;

        updateStats();
        filterUsuarios();
        showToast(`Role atualizado para "${novoRole}" ✓`);
    } catch (e) {
        console.error('Erro ao atualizar role', e);
        showToast('Erro ao atualizar role: ' + e.message, 'error');
        // Reverter select para valor original
        const u = allUsuarios.find(x => x.id === userId);
        if (u) document.getElementById(`sel-${userId}`).value = u.role;
    }
}

// ── Loading shimmer ───────────────────────────────────────────────
function showLoading() {
    const el = document.getElementById('user-list');
    el.innerHTML = Array(4).fill('<div class="shimmer"></div>').join('');
}

// ── Utilitários ───────────────────────────────────────────────────
function getInitials(nome, sobrenome) {
    const a = (nome || '?')[0] || '';
    const b = (sobrenome || '')[0] || '';
    return (a + b).toUpperCase() || '?';
}

function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Toast ─────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    document.getElementById('toast-icon').textContent = type === 'error' ? 'error' : 'check_circle';
    document.getElementById('toast-icon').style.color = type === 'error' ? '#f87171' : '#25f4f4';
    document.getElementById('toast-msg').textContent  = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
