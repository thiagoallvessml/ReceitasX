<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Solicitar Reembolso - ReceitasX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-guard.js"></script>
    <link rel="stylesheet" href="critical.css" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary:"#25f4f4","background-dark":"#121212","card-dark":"#1A1A1A","border-dark":"#2A2A2A" }, fontFamily:{ display:["Inter","sans-serif"] } } }
        }
    </script>
    <style>
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; vertical-align:middle; }
        input,textarea,select { background-color:#141414 !important; color:#f1f5f9 !important; border-color:#2A2A2A !important; }
        input::placeholder,textarea::placeholder { color:#475569 !important; }
        input:focus,textarea:focus,select:focus { border-color:rgba(37,244,244,.5) !important; box-shadow:0 0 0 3px rgba(37,244,244,.07) !important; outline:none !important; }

        .btn-back { display:flex;align-items:center;gap:.3rem;color:#94a3b8;font-size:.85rem;cursor:pointer;transition:color .15s;background:none;border:none;padding:0; }
        .btn-back:hover { color:#25f4f4; }
        
        .cfg-card { background:#1A1A1A; border:1px solid #2A2A2A; border-radius:1rem; padding:1.5rem; margin-top:2rem; }
        .field-label { font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#64748b; margin-bottom:.35rem; display:block; }
        .fc { width:100%; padding:.75rem 1rem; border-radius:.75rem; border:1px solid #2A2A2A !important; background:#141414 !important; color:#f1f5f9 !important; font-size:.95rem; outline:none; transition:border-color .2s; }
        
        .btn-enviar { width:100%; display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.9rem; border-radius:.75rem; border:none; background:linear-gradient(135deg,#25f4f4,#0dc8c8); color:#0a0a0a; font-weight:700; font-size:.95rem; cursor:pointer; box-shadow:0 4px 20px rgba(37,244,244,.25); transition:all .2s; margin-top:1.5rem; }
        .btn-enviar:hover { opacity:.9; box-shadow:0 6px 28px rgba(37,244,244,.4); }
        .btn-enviar:disabled { opacity:.5; cursor:not-allowed; }
        
        .info-box { background:rgba(37,244,244,.05); border:1px solid rgba(37,244,244,.15); border-radius:.75rem; padding:1rem; font-size:.85rem; color:#94a3b8; margin-bottom:1.5rem; display:flex; gap:.75rem; align-items:flex-start; }
        .info-box .material-symbols-outlined { color:#25f4f4; font-size:1.25rem; font-variation-settings:'FILL' 1; }

        /* Toast */
        #toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); background:#1E1E1E; border:1px solid rgba(37,244,244,.35); color:#f1f5f9; padding:.65rem 1.2rem; border-radius:.75rem; font-size:.85rem; font-weight:500; display:flex; align-items:center; gap:.5rem; z-index:200; opacity:0; transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s; }
        #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    </style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen">

<header class="sticky top-0 z-20 bg-background-dark/90 backdrop-blur border-b border-border-dark">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center gap-3">
        <button class="btn-back" onclick="history.back()">
            <span class="material-symbols-outlined" style="font-size:1.25rem">arrow_back</span>
        </button>
        <h1 class="text-base font-semibold flex-1">Solicitar Reembolso</h1>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-8">

    <div class="info-box">
        <span class="material-symbols-outlined">info</span>
        <div>
            <h3 class="font-bold text-white mb-1">Garantia de 7 Dias</h3>
            <p>Você tem até 7 dias após a compra para solicitar o reembolso do seu plano. O prazo para o dinheiro constar na sua conta é de até <strong>3 dias úteis</strong>.</p>
        </div>
    </div>

    <div class="cfg-card">
        <h2 class="text-xl font-bold text-white mb-6">Preencha os dados</h2>
        
        <div class="space-y-4">
            <div>
                <label class="field-label">Seu Email (da compra)</label>
                <input id="f-email" type="email" class="fc bg-[#1E1E1E] opacity-60 cursor-not-allowed" readonly />
            </div>

            <div>
                <label class="field-label">Motivo do Cancelamento</label>
                <textarea id="f-motivo" class="fc" rows="3" placeholder="Por que você deseja cancelar?" required></textarea>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="field-label">Tipo de Chave Pix</label>
                    <select id="f-pix-tipo" class="fc">
                        <option value="cpf">CPF / CNPJ</option>
                        <option value="email">Email</option>
                        <option value="celular">Celular</option>
                        <option value="aleatoria">Chave Aleatória</option>
                    </select>
                </div>
                <div>
                    <label class="field-label">Chave Pix para Retorno</label>
                    <input id="f-pix-chave" type="text" class="fc" placeholder="Sua chave pix..." required />
                </div>
            </div>

            <button id="btn-enviar" class="btn-enviar" onclick="enviarSolicitacao()">
                <span class="material-symbols-outlined">send</span>
                Enviar Solicitação
            </button>
        </div>
    </div>

</main>

<div id="toast">
    <span id="toast-icon" class="material-symbols-outlined" style="font-size:1rem;color:#25f4f4">check_circle</span>
    <span id="toast-msg">Enviado!</span>
</div>

<script>
let _userEmail = '';

(async () => {
    const session = await getSession();
    if(session && session.user) {
        _userEmail = session.user.email;
        document.getElementById('f-email').value = _userEmail;
    }
})();

async function enviarSolicitacao() {
    const motivo = document.getElementById('f-motivo').value.trim();
    const pixTipo = document.getElementById('f-pix-tipo').value;
    const pixChave = document.getElementById('f-pix-chave').value.trim();

    if(!motivo || !pixChave) {
        showToast('Preencha o motivo e a chave pix!', 'error');
        return;
    }

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined" style="animation:spin 1s linear infinite">progress_activity</span> Enviando...';

    try {
        const session = await getSession();
        if(!session) throw new Error("Não autenticado");

        const payload = {
            user_id: session.user.id,
            email: session.user.email,
            motivo: motivo,
            pix_tipo: pixTipo,
            pix_chave: pixChave
        };

        const { error } = await sb.from('reembolsos').insert(payload);
        if(error) throw error;

        showToast('Solicitação recebida com sucesso!');
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1500);

    } catch(e) {
        console.error(e);
        showToast('Erro: ' + e.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">send</span> Enviar Solicitação';
    }
}

let toastTimer;
function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    document.getElementById('toast-icon').textContent = type === 'error' ? 'error' : 'check_circle';
    document.getElementById('toast-icon').style.color = type === 'error' ? '#f87171' : '#25f4f4';
    document.getElementById('toast-msg').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
