<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Avisos aos Usuários - Admin · ReceitasX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary:"#25f4f4","background-dark":"#121212","card-dark":"#1E1E1E","border-dark":"#2A2A2A" }, fontFamily:{ display:["Inter","sans-serif"] } } }
        }
    </script>
    <style>
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; background:#121212; color:#f1f5f9; }
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; vertical-align:middle; }

        .btn-back { display:flex;align-items:center;gap:.3rem;color:#64748b;font-size:.85rem;cursor:pointer;transition:color .15s;background:none;border:none;padding:0; }
        .btn-back:hover { color:#25f4f4; }

        .cfg-card { background:#1A1A1A;border:1px solid #2A2A2A;border-radius:1.15rem;overflow:hidden;margin-bottom:1.25rem; }
        .cfg-card-head { display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem;border-bottom:1px solid #2A2A2A; }
        .cfg-card-head .ico { width:2.2rem;height:2.2rem;border-radius:.6rem;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
        .cfg-card-head h2 { font-size:.92rem;font-weight:700; }
        .cfg-card-head p { font-size:.72rem;color:#64748b;margin-top:.1rem; }
        .cfg-body { padding:1.25rem;display:flex;flex-direction:column;gap:1rem; }

        .field { display:flex;flex-direction:column;gap:.35rem; }
        .field label { font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#64748b; }
        .field-desc { font-size:.7rem;color:#475569;margin-top:-.15rem; }
        .input-wrap { display:flex;align-items:center;border:1px solid #2A2A2A !important;border-radius:.75rem;background:#111 !important;overflow:hidden;transition:border-color .2s; }
        .input-wrap:focus-within { border-color:rgba(37,244,244,.45) !important; }
        .cfg-input { flex:1;background:transparent !important;border:none !important;outline:none !important;color:#f1f5f9 !important;font-size:.95rem;font-weight:600;padding:.7rem .9rem;width:100%;box-shadow:none !important; }
        .cfg-input::placeholder { color:#334155 !important;font-weight:400; }
        .cfg-textarea { background:#111 !important;border:1px solid #2A2A2A !important;border-radius:.75rem;color:#f1f5f9 !important;font-size:.88rem;font-weight:500;padding:.7rem .9rem;width:100%;min-height:120px;resize:vertical;outline:none !important;box-shadow:none !important;font-family:'Inter',sans-serif;transition:border-color .2s; }
        .cfg-textarea:focus { border-color:rgba(37,244,244,.45) !important; }
        .cfg-textarea::placeholder { color:#334155 !important;font-weight:400; }
        .cfg-select { flex:1;background:#111 !important;border:1px solid #2A2A2A !important;border-radius:.75rem;color:#f1f5f9 !important;font-size:.88rem;font-weight:600;padding:.7rem .9rem;width:100%;outline:none !important;box-shadow:none !important;cursor:pointer;appearance:auto;transition:border-color .2s; }
        .cfg-select:focus { border-color:rgba(37,244,244,.45) !important; }

        .btn-send { display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:.8rem;border:none;background:linear-gradient(135deg,#25f4f4,#0dc8c8);color:#0a0a0a;font-weight:800;font-size:.88rem;cursor:pointer;transition:opacity .15s, box-shadow .2s;box-shadow:0 4px 16px rgba(37,244,244,.2); }
        .btn-send:hover { opacity:.9;box-shadow:0 6px 24px rgba(37,244,244,.35); }
        .btn-send:disabled { opacity:.45;cursor:not-allowed;box-shadow:none; }
        .btn-send .material-symbols-outlined { font-size:1rem;font-variation-settings:'FILL' 1,'wght' 700,'GRAD' 0,'opsz' 24; }

        .tipo-chip { display:inline-flex;align-items:center;gap:.25rem;padding:.25rem .65rem;border-radius:9999px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em; }
        .tipo-info     { background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.25); }
        .tipo-aviso    { background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25); }
        .tipo-urgente  { background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.25); }
        .tipo-novidade { background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.25); }

        .aviso-card { background:#1A1A1A;border:1px solid #2A2A2A;border-radius:.85rem;padding:1rem;transition:border-color .15s; }
        .aviso-card:hover { border-color:rgba(37,244,244,.18); }
        .aviso-card.inativo { opacity:.45; }

        .btn-sm { padding:.35rem .65rem;border-radius:.5rem;border:1px solid #2A2A2A;background:transparent;color:#64748b;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s; }
        .btn-sm:hover { border-color:rgba(37,244,244,.3);color:#25f4f4; }
        .btn-sm.danger:hover { border-color:rgba(248,113,113,.3);color:#f87171; }

        .admin-banner { display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:rgba(251,146,60,.05);border:1px solid rgba(251,146,60,.18);border-radius:.75rem;font-size:.75rem;color:#fb923c;margin-bottom:1.5rem; }

        .user-search-wrap { position:relative; }
        .user-search-results { position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:.75rem;z-index:10;margin-top:.25rem;display:none; }
        .user-search-results.show { display:block; }
        .user-search-item { padding:.65rem .9rem;cursor:pointer;font-size:.82rem;color:#94a3b8;transition:background .1s; }
        .user-search-item:hover { background:rgba(37,244,244,.06);color:#f1f5f9; }
        .user-search-item .name { font-weight:600;color:#f1f5f9; }
        .user-search-item .email { font-size:.72rem;color:#64748b; }

        #toast { position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#1E1E1E;border:1px solid rgba(37,244,244,.35);color:#f1f5f9;padding:.65rem 1.2rem;border-radius:.75rem;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:.5rem;z-index:300;opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;box-shadow:0 8px 32px rgba(0,0,0,.5);white-space:nowrap; }
        #toast.show { transform:translateX(-50%) translateY(0);opacity:1; }

        .skeleton { background:linear-gradient(90deg,#1A1A1A 25%,#222 50%,#1A1A1A 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:.5rem; }
        @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
        @keyframes spin{to{transform:rotate(360deg)}}

        .tab-bar { display:flex;gap:0;border-bottom:1px solid #2A2A2A;margin-bottom:1.5rem; }
        .tab-btn { flex:1;padding:.75rem;text-align:center;font-size:.78rem;font-weight:700;color:#475569;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;background:none;border-left:none;border-right:none;border-top:none; }
        .tab-btn.active { color:#25f4f4;border-bottom-color:#25f4f4; }
        .tab-btn:hover:not(.active) { color:#94a3b8; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        .stat-pill { display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .75rem;border-radius:9999px;font-size:.72rem;font-weight:700;background:#111;border:1px solid #2A2A2A; }
    </style>
</head>
<body class="min-h-screen pb-24">

<!-- ══ Header ══════════════════════════════════════════════════════ -->
<header style="position:sticky;top:0;z-index:30;background:rgba(18,18,18,.95);backdrop-filter:blur(16px);border-bottom:1px solid #2A2A2A;">
    <div style="max-width:680px;margin:0 auto;padding:0 1.25rem;height:3.5rem;display:flex;align-items:center;gap:1rem;">
        <button class="btn-back" onclick="history.back()">
            <span class="material-symbols-outlined" style="font-size:1.2rem">arrow_back</span>
        </button>
        <span class="material-symbols-outlined" style="color:#fb923c;font-size:1.1rem;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">campaign</span>
        <h1 style="font-size:.95rem;font-weight:700;flex:1">Avisos aos Usuários</h1>
    </div>
</header>

<!-- ══ Main ════════════════════════════════════════════════════════ -->
<main style="max-width:680px;margin:0 auto;padding:1.5rem 1.25rem;">

    <div class="admin-banner">
        <span class="material-symbols-outlined" style="font-size:1rem;color:#fb923c;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">info</span>
        <span>Crie mensagens que aparecerão como popup quando os usuários entrarem no sistema. Execute o script <strong>avisos_admin_schema.sql</strong> no Supabase antes de usar.</span>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('novo')">
            <span class="material-symbols-outlined" style="font-size:.9rem;vertical-align:middle;margin-right:.2rem">edit_note</span>
            Novo Aviso
        </button>
        <button class="tab-btn" onclick="switchTab('historico')">
            <span class="material-symbols-outlined" style="font-size:.9rem;vertical-align:middle;margin-right:.2rem">history</span>
            Histórico
        </button>
    </div>

    <!-- ── Tab: Novo Aviso ── -->
    <div class="tab-content active" id="tab-novo">
        <div class="cfg-card">
            <div class="cfg-card-head">
                <div class="ico" style="background:rgba(37,244,244,.08);border:1px solid rgba(37,244,244,.18);">
                    <span class="material-symbols-outlined" style="font-size:1.1rem;color:#25f4f4;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">send</span>
                </div>
                <div>
                    <h2>Criar Aviso</h2>
                    <p>A mensagem será exibida ao usuário ao entrar no sistema.</p>
                </div>
            </div>
            <div class="cfg-body">

                <!-- Título -->
                <div class="field">
                    <label>Título</label>
                    <div class="input-wrap">
                        <input class="cfg-input" id="inp-titulo" type="text" placeholder="Ex: Novidade no ReceitasX!" maxlength="120" />
                    </div>
                </div>

                <!-- Mensagem -->
                <div class="field">
                    <label>Mensagem</label>
                    <textarea class="cfg-textarea" id="inp-mensagem" placeholder="Escreva a mensagem que o usuário verá..." maxlength="2000"></textarea>
                </div>

                <!-- Imagem (Opcional) -->
                <div class="field">
                    <label>Imagem (Opcional)</label>
                    <div style="display:flex;gap:.5rem;align-items:center;">
                        <div class="input-wrap" style="flex:1">
                            <input class="cfg-input" id="inp-imagem" type="text" placeholder="Cole a URL ou faça upload..." />
                        </div>
                        <label style="cursor:pointer;padding:.7rem;border-radius:.75rem;background:#1A1A1A;border:1px solid #2A2A2A;color:#25f4f4;display:flex;align-items:center;transition:border-color .2s">
                            <input type="file" id="inp-file" accept="image/*" style="display:none" onchange="uploadImagemAviso(this)" />
                            <span class="material-symbols-outlined" style="font-size:1.1rem">upload</span>
                        </label>
                    </div>
                    <div id="upload-status" style="font-size:.7rem;color:#94a3b8;margin-top:.2rem;display:none;"></div>
                </div>

                <!-- Tipo -->
                <div class="field">
                    <label>Tipo</label>
                    <select class="cfg-select" id="inp-tipo">
                        <option value="info">ℹ️ Informação</option>
                        <option value="novidade">🎉 Novidade</option>
                        <option value="aviso">⚠️ Aviso</option>
                        <option value="urgente">🚨 Urgente</option>
                    </select>
                </div>

                <!-- Destino -->
                <div class="field">
                    <label>Destinatário</label>
                    <select class="cfg-select" id="inp-destino" onchange="toggleDestinoUser()">
                        <option value="todos">📢 Todos os usuários</option>
                        <option value="usuario">👤 Usuário específico</option>
                    </select>
                </div>

                <!-- Buscar usuário (condicional) -->
                <div class="field" id="field-user" style="display:none">
                    <label>Buscar Usuário</label>
                    <div class="user-search-wrap">
                        <div class="input-wrap">
                            <input class="cfg-input" id="inp-user-search" type="text" placeholder="Digite nome ou e-mail..." oninput="searchUsers()" autocomplete="off" />
                        </div>
                        <div class="user-search-results" id="user-results"></div>
                    </div>
                    <div id="selected-user" style="display:none;margin-top:.35rem;padding:.5rem .75rem;background:rgba(37,244,244,.06);border:1px solid rgba(37,244,244,.18);border-radius:.6rem;font-size:.8rem;color:#25f4f4;font-weight:600;display:flex;align-items:center;gap:.5rem;"></div>
                </div>

                <!-- Botão enviar -->
                <div style="display:flex;justify-content:flex-end;margin-top:.5rem">
                    <button class="btn-send" id="btn-enviar" onclick="enviarAviso()">
                        <span class="material-symbols-outlined">send</span>
                        Publicar Aviso
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- ── Tab: Histórico ── -->
    <div class="tab-content" id="tab-historico">
        <div id="historico-list">
            <div class="skeleton" style="height:4rem;margin-bottom:.75rem"></div>
            <div class="skeleton" style="height:4rem;margin-bottom:.75rem"></div>
        </div>
    </div>

</main>

<!-- ══ Toast ══════════════════════════════════════════════════════ -->
<div id="toast">
    <span id="toast-icon" class="material-symbols-outlined" style="font-size:1rem;color:#25f4f4">check_circle</span>
    <span id="toast-msg">Salvo!</span>
</div>

<script>
/* ── Guard: só admin ─────────────────────────────────────────────── */
let currentUserId = null;
let allPerfis = [];
let emailsMap = {};
let selectedUserId = null;

(async () => {
    await _waitForRole(4000);
    if (window.__userRole !== 'admin') {
        document.body.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;font-family:Inter,sans-serif">
                <span class="material-symbols-outlined" style="font-size:3rem;color:#f87171">block</span>
                <h1 style="font-size:1.2rem;font-weight:700">Acesso Negado</h1>
                <a href="index" style="color:#25f4f4;font-weight:600">← Voltar</a>
            </div>`;
        return;
    }

    const { data: { session } } = await sb.auth.getSession();
    currentUserId = session.user.id;

    // Carregar perfis e emails
    const { data: perfis } = await sb.from('perfis').select('id, nome, sobrenome').order('nome');
    allPerfis = perfis || [];

    try {
        const resp = await fetch('https://pipknmwjpblitqlxxdcw.supabase.co/functions/v1/list-users', {
            headers: { 'Authorization': `Bearer ${session.access_token}` }
        });
        if (resp.ok) {
            const body = await resp.json();
            (body.users || []).forEach(u => emailsMap[u.id] = u.email);
        }
    } catch(_) {}

    loadHistorico();
})();

/* ── Tabs ─────────────────────────────────────────────────────────── */
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (tab === 'novo' ? i === 0 : i === 1)));
    document.getElementById('tab-novo').classList.toggle('active', tab === 'novo');
    document.getElementById('tab-historico').classList.toggle('active', tab === 'historico');
    if (tab === 'historico') loadHistorico();
}

/* ── Toggle destino usuário ───────────────────────────────────────── */
function toggleDestinoUser() {
    const val = document.getElementById('inp-destino').value;
    document.getElementById('field-user').style.display = val === 'usuario' ? '' : 'none';
    if (val !== 'usuario') {
        selectedUserId = null;
        document.getElementById('selected-user').style.display = 'none';
    }
}

/* ── Buscar usuários ──────────────────────────────────────────────── */
let searchTimeout;
function searchUsers() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const q = (document.getElementById('inp-user-search').value || '').toLowerCase().trim();
        const el = document.getElementById('user-results');
        if (!q || q.length < 2) { el.classList.remove('show'); return; }

        const matches = allPerfis.filter(p => {
            const name = ((p.nome||'') + ' ' + (p.sobrenome||'')).toLowerCase();
            const email = (emailsMap[p.id] || '').toLowerCase();
            return name.includes(q) || email.includes(q);
        }).slice(0, 8);

        if (!matches.length) {
            el.innerHTML = `<div class="user-search-item" style="color:#475569">Nenhum resultado</div>`;
        } else {
            el.innerHTML = matches.map(p => {
                const name = [p.nome, p.sobrenome].filter(Boolean).join(' ') || 'Sem Nome';
                const email = emailsMap[p.id] || '';
                return `<div class="user-search-item" onclick="selectUser('${p.id}', '${esc(name)}', '${esc(email)}')">
                    <div class="name">${esc(name)}</div>
                    ${email ? `<div class="email">${esc(email)}</div>` : ''}
                </div>`;
            }).join('');
        }
        el.classList.add('show');
    }, 250);
}

function selectUser(id, name, email) {
    selectedUserId = id;
    document.getElementById('user-results').classList.remove('show');
    document.getElementById('inp-user-search').value = '';
    const el = document.getElementById('selected-user');
    el.style.display = 'flex';
    el.innerHTML = `
        <span class="material-symbols-outlined" style="font-size:.9rem">person</span>
        <span>${name}</span>
        ${email ? `<span style="color:#64748b;font-weight:400;font-size:.72rem">(${email})</span>` : ''}
        <button onclick="clearSelectedUser()" style="margin-left:auto;background:none;border:none;color:#f87171;cursor:pointer;padding:0;line-height:0">
            <span class="material-symbols-outlined" style="font-size:.85rem">close</span>
        </button>
    `;
}

function clearSelectedUser() {
    selectedUserId = null;
    document.getElementById('selected-user').style.display = 'none';
}

/* ── Enviar aviso ─────────────────────────────────────────────────── */
async function uploadImagemAviso(input) {
    const file = input.files[0];
    if (!file) return;
    
    const statusEl = document.getElementById('upload-status');
    statusEl.style.display = 'block';
    statusEl.style.color = '#94a3b8';
    statusEl.textContent = 'Fazendo upload...';
    
    try {
        const ext = file.name.split('.').pop();
        const fileName = `aviso_${Date.now()}.${ext}`;
        const filePath = `avisos/${fileName}`;
        
        const { error } = await sb.storage.from('avatars').upload(filePath, file);
        if (error) throw error;
        
        const { data } = sb.storage.from('avatars').getPublicUrl(filePath);
        document.getElementById('inp-imagem').value = data.publicUrl;
        
        statusEl.style.color = '#34d399';
        statusEl.textContent = 'Upload concluído!';
        setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
    } catch (e) {
        console.error('Erro upload:', e);
        statusEl.style.color = '#f87171';
        statusEl.textContent = 'Erro ao enviar: ' + e.message;
    }
}

async function enviarAviso() {
    const titulo = document.getElementById('inp-titulo').value.trim();
    const mensagem = document.getElementById('inp-mensagem').value.trim();
    const tipo = document.getElementById('inp-tipo').value;
    const destino = document.getElementById('inp-destino').value;
    const imagem_url = document.getElementById('inp-imagem').value.trim();

    if (!titulo) { showToast('Preencha o título', 'error'); return; }
    if (!mensagem) { showToast('Preencha a mensagem', 'error'); return; }
    if (destino === 'usuario' && !selectedUserId) { showToast('Selecione um usuário', 'error'); return; }

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:1rem;animation:spin .8s linear infinite">sync</span> Publicando…`;

    try {
        const payload = {
            titulo,
            mensagem,
            tipo,
            destino,
            destino_user_id: destino === 'usuario' ? selectedUserId : null,
            imagem_url: imagem_url || null,
            ativo: true,
            created_by: currentUserId
        };

        const { error } = await sb.from('avisos_admin').insert(payload);
        if (error) throw error;

        showToast('✓ Aviso publicado com sucesso!');

        // Limpar campos
        document.getElementById('inp-titulo').value = '';
        document.getElementById('inp-mensagem').value = '';
        document.getElementById('inp-imagem').value = '';
        document.getElementById('inp-tipo').value = 'info';
        document.getElementById('inp-destino').value = 'todos';
        toggleDestinoUser();
        clearSelectedUser();

    } catch (e) {
        console.error('Erro ao publicar aviso:', e);
        showToast('Erro: ' + (e?.message || 'verifique o console'), 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined">send</span> Publicar Aviso`;
    }
}

/* ── Histórico ────────────────────────────────────────────────────── */
async function loadHistorico() {
    const el = document.getElementById('historico-list');
    try {
        const { data, error } = await sb.from('avisos_admin')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50);

        if (error) throw error;

        if (!data || !data.length) {
            el.innerHTML = `<div style="text-align:center;padding:3rem;color:#475569;font-size:.88rem">Nenhum aviso publicado ainda.</div>`;
            return;
        }

        // Buscar quem já viu (para os avisos carregados)
        const avisoIds = data.map(a => a.id);
        const { data: vistos } = await sb.from('avisos_vistos')
            .select('aviso_id, user_id, visto_em')
            .in('aviso_id', avisoIds);

        const vistosMap = {}; // aviso_id => [array de vistos]
        (vistos || []).forEach(v => {
            if (!vistosMap[v.aviso_id]) vistosMap[v.aviso_id] = [];
            vistosMap[v.aviso_id].push(v);
        });

        el.innerHTML = data.map(a => {
            const tipoLabel = { info:'Informação', aviso:'Aviso', urgente:'Urgente', novidade:'Novidade' }[a.tipo] || a.tipo;
            const tipoClass = `tipo-${a.tipo}`;
            const destinoLabel = a.destino === 'todos' ? '📢 Todos' : '👤 ' + getUserName(a.destino_user_id);
            const dt = new Date(a.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
            
            const avisoVistos = vistosMap[a.id] || [];
            let statusBadge = '';

            if (a.destino === 'usuario') {
                const leu = avisoVistos.some(v => v.user_id === a.destino_user_id);
                if (leu) {
                    const dtLido = new Date(avisoVistos.find(v => v.user_id === a.destino_user_id).visto_em).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
                    statusBadge = `<span style="display:inline-flex;align-items:center;gap:.25rem;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);color:#34d399;padding:.2rem .5rem;border-radius:.5rem;font-size:.65rem;font-weight:700;"><span class="material-symbols-outlined" style="font-size:.8rem">done_all</span> Lido (${dtLido})</span>`;
                } else {
                    statusBadge = `<span style="display:inline-flex;align-items:center;gap:.25rem;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:#fbbf24;padding:.2rem .5rem;border-radius:.5rem;font-size:.65rem;font-weight:700;"><span class="material-symbols-outlined" style="font-size:.8rem">schedule</span> Pendente (Não Lido)</span>`;
                }
            } else {
                if (avisoVistos.length > 0) {
                    statusBadge = `<span style="display:inline-flex;align-items:center;gap:.25rem;background:rgba(37,244,244,.1);border:1px solid rgba(37,244,244,.25);color:#25f4f4;padding:.2rem .5rem;border-radius:.5rem;font-size:.65rem;font-weight:700;"><span class="material-symbols-outlined" style="font-size:.8rem">visibility</span> ${avisoVistos.length} visualizações</span>`;
                } else {
                    statusBadge = `<span style="display:inline-flex;align-items:center;gap:.25rem;background:rgba(100,116,139,.1);border:1px solid rgba(100,116,139,.25);color:#94a3b8;padding:.2rem .5rem;border-radius:.5rem;font-size:.65rem;font-weight:700;"><span class="material-symbols-outlined" style="font-size:.8rem">visibility_off</span> 0 visualizações</span>`;
                }
            }

            return `
            <div class="aviso-card ${a.ativo ? '' : 'inativo'}" style="margin-bottom:.75rem">
                <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap">
                    <span class="tipo-chip ${tipoClass}">${tipoLabel}</span>
                    <span style="font-size:.68rem;color:#475569">${destinoLabel}</span>
                    ${a.imagem_url ? `<span class="material-symbols-outlined" style="font-size:.85rem;color:#34d399;" title="Com Imagem">image</span>` : ''}
                    <span style="font-size:.65rem;color:#334155;margin-left:auto">${dt}</span>
                </div>
                <div style="font-weight:700;font-size:.88rem;margin-bottom:.25rem">${esc(a.titulo)}</div>
                <div style="font-size:.78rem;color:#94a3b8;line-height:1.5;margin-bottom:.65rem;white-space:pre-wrap">${esc(a.mensagem)}</div>
                <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.25rem">
                    ${statusBadge}
                    <div style="display:flex;gap:.4rem">
                        ${a.ativo
                            ? `<button class="btn-sm danger" onclick="toggleAviso('${a.id}', false)">
                                   <span class="material-symbols-outlined" style="font-size:.75rem;vertical-align:middle;margin-right:.15rem">visibility_off</span>Desativar
                               </button>`
                            : `<button class="btn-sm" onclick="toggleAviso('${a.id}', true)">
                                   <span class="material-symbols-outlined" style="font-size:.75rem;vertical-align:middle;margin-right:.15rem">visibility</span>Reativar
                               </button>`
                        }
                        <button class="btn-sm danger" onclick="deletarAviso('${a.id}')">
                            <span class="material-symbols-outlined" style="font-size:.75rem;vertical-align:middle;margin-right:.15rem">delete</span>Excluir
                        </button>
                    </div>
                </div>
            </div>`;
        }).join('');

    } catch (e) {
        el.innerHTML = `<div style="text-align:center;padding:2rem;color:#f87171;font-size:.85rem">Erro: ${e.message}<br><span style="font-size:.75rem;color:#94a3b8">Execute o script avisos_admin_schema.sql no Supabase.</span></div>`;
    }
}

function getUserName(userId) {
    if (!userId) return '—';
    const p = allPerfis.find(x => x.id === userId);
    if (p) return [p.nome, p.sobrenome].filter(Boolean).join(' ') || emailsMap[userId] || userId.slice(0,8);
    return emailsMap[userId] || userId.slice(0,8);
}

async function toggleAviso(id, ativo) {
    await sb.from('avisos_admin').update({ ativo }).eq('id', id);
    showToast(ativo ? 'Aviso reativado' : 'Aviso desativado');
    loadHistorico();
}

async function deletarAviso(id) {
    if (!confirm('Excluir este aviso permanentemente?')) return;
    await sb.from('avisos_admin').delete().eq('id', id);
    showToast('Aviso excluído');
    loadHistorico();
}

/* ── Toast ───────────────────────────────────────────────────────── */
let toastTimer;
function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    document.getElementById('toast-icon').textContent = type === 'error' ? 'error' : 'check_circle';
    document.getElementById('toast-icon').style.color  = type === 'error' ? '#f87171' : '#25f4f4';
    document.getElementById('toast-msg').textContent   = msg;
    t.style.borderColor = type === 'error' ? 'rgba(248,113,113,.35)' : 'rgba(37,244,244,.35)';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Fechar dropdown ao clicar fora
document.addEventListener('click', e => {
    const userRes = document.getElementById('user-results');
    const searchWrap = document.querySelector('.user-search-wrap');
    if (userRes && searchWrap && !searchWrap.contains(e.target)) {
        userRes.classList.remove('show');
    }
});
</script>
