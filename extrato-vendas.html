<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Extrato de Vendas · ReceitasX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#25f4f4", "background-dark": "#0a0a0a", "card-dark": "#141414", "border-dark": "#1E1E1E" }, fontFamily: { display: ["Inter", "sans-serif"] } } }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background: #0a0a0a; color: #f1f5f9; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }

        .glass-header {
            background: rgba(10,10,10,.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(37,244,244,.1);
        }
        .glass-footer {
            background: rgba(10,10,10,.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid #1E1E1E;
        }

        /* Summary Card */
        .summary-card {
            background: linear-gradient(135deg, #0f1a1a, #111f1f);
            border: 1px solid rgba(37,244,244,.18);
            border-radius: 1.1rem;
            padding: 1.4rem;
            position: relative;
            overflow: hidden;
        }
        .summary-card::before {
            content: '';
            position: absolute;
            top: -60px; right: -40px;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37,244,244,.12), transparent 70%);
            pointer-events: none;
        }

        /* Activity Item */
        .activity-item {
            background: #141414;
            border: 1px solid #1E1E1E;
            border-radius: .9rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: .85rem;
            transition: border-color .2s, transform .15s;
            animation: fadeUp .35s ease both;
        }
        .activity-item:hover { border-color: rgba(37,244,244,.2); transform: translateY(-1px); }
        @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        .ico-wrap {
            width: 2.5rem; height: 2.5rem;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .ico-wrap.pago    { background: rgba(37,244,244,.1); }
        .ico-wrap.pending { background: rgba(251,191,36,.1); }
        .ico-wrap.fail    { background: rgba(248,113,113,.1); }

        .badge-status {
            display: inline-block;
            padding: .15rem .5rem;
            border-radius: 9999px;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin-top: .2rem;
        }
        .badge-pago      { background: rgba(52,211,153,.15); color: #34d399; }
        .badge-pendente  { background: rgba(251,191,36,.15);  color: #fbbf24; }
        .badge-falhou    { background: rgba(248,113,113,.15); color: #f87171; }

        /* Progress bar */
        .prog-track {
            width: 100%; height: 6px;
            background: rgba(255,255,255,.08);
            border-radius: 9999px;
            overflow: hidden;
        }
        .prog-fill {
            height: 100%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #25f4f4, #0dc8c8);
            box-shadow: 0 0 8px rgba(37,244,244,.5);
            transition: width .8s cubic-bezier(.4,0,.2,1);
        }

        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: .5rem;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* Tabs */
        .tab-btn { padding: .4rem 1rem; border-radius: 9999px; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s; border: none; background: transparent; color: #64748b; }
        .tab-btn.active { background: rgba(37,244,244,.1); color: #25f4f4; }

        /* Empty state */
        .empty-state { text-align: center; padding: 3rem 1rem; color: #475569; }
        .empty-state .material-symbols-outlined { font-size: 3rem; margin-bottom: .75rem; display: block; }

        /* Btn saque */
        .btn-saque {
            width: 100%; padding: .9rem;
            border-radius: .85rem; border: none;
            background: linear-gradient(135deg, #25f4f4, #0dc8c8);
            color: #0a0a0a; font-weight: 800; font-size: .95rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem;
            box-shadow: 0 4px 20px rgba(37,244,244,.3);
            transition: opacity .15s, transform .15s;
        }
        .btn-saque:hover { opacity: .9; }
        .btn-saque:active { transform: scale(.97); }
        .btn-saque:disabled { opacity: .45; cursor: not-allowed; transform: none; }
        .btn-saque .material-symbols-outlined { font-size: 1.1rem; font-variation-settings: 'FILL' 1,'wght' 700,'GRAD' 0,'opsz' 24; }
    </style>
</head>
<body style="padding-bottom: 10rem;">

<!-- ══ Header ═══════════════════════════════════════════════════════ -->
<header class="glass-header sticky top-0 z-40" style="padding: .85rem 1.15rem; display: flex; align-items: center; gap: 1rem;">
    <button onclick="history.back()" style="background:none;border:none;color:#25f4f4;cursor:pointer;display:flex;align-items:center;padding:0;flex-shrink:0;">
        <span class="material-symbols-outlined" style="font-size:1.5rem">chevron_left</span>
    </button>
    <h1 style="flex:1; font-size:.95rem; font-weight:700;">Extrato de Vendas</h1>
    <button id="btn-filtro" style="background:none;border:none;color:#25f4f4;cursor:pointer;display:flex;align-items:center;padding:0;" title="Filtrar">
        <span class="material-symbols-outlined" style="font-size:1.3rem">filter_list</span>
    </button>
</header>

<main style="padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; max-width: 560px; margin: 0 auto;">

    <!-- ── Resumo ─────────────────────────────────────────────────── -->
    <div class="summary-card" style="position:relative;z-index:1;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem">
            <p style="font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#64748b">Resumo Geral</p>
            <span class="material-symbols-outlined" style="font-size:1.3rem;color:rgba(37,244,244,.4);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">account_balance_wallet</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div>
                <p style="font-size:.72rem;color:#64748b;margin-bottom:.25rem">Total em Comissões</p>
                <p id="total-ganhos" style="font-size:1.75rem;font-weight:900;background:linear-gradient(135deg,#25f4f4,#0dc8c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1">—</p>
            </div>
            <div style="border-left:1px solid rgba(255,255,255,.07);padding-left:1rem;">
                <p style="font-size:.72rem;color:#64748b;margin-bottom:.25rem">A Receber</p>
                <p id="a-receber" style="font-size:1.75rem;font-weight:900;color:#fbbf24;line-height:1">—</p>
            </div>
        </div>
        <div style="display:flex;gap:1.5rem;margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.06);">
            <div>
                <p style="font-size:.68rem;color:#64748b;">Vendas Confirmadas</p>
                <p id="total-vendas" style="font-size:.9rem;font-weight:700;color:#f1f5f9;">—</p>
            </div>
            <div>
                <p style="font-size:.68rem;color:#64748b;">Em Processamento</p>
                <p id="total-pendentes" style="font-size:.9rem;font-weight:700;color:#fbbf24;">—</p>
            </div>
        </div>
    </div>

    <!-- ── Tabs filtro ────────────────────────────────────────────── -->
    <div style="display:flex;gap:.4rem;background:#141414;border:1px solid #1E1E1E;border-radius:9999px;padding:.3rem;">
        <button class="tab-btn active" data-filtro="todos" onclick="filtrar('todos', this)">Todas</button>
        <button class="tab-btn" data-filtro="converteu" onclick="filtrar('converteu', this)">Confirmadas</button>
        <button class="tab-btn" data-filtro="pendente" onclick="filtrar('pendente', this)">Pendentes</button>
    </div>

    <!-- ── Lista de atividades ────────────────────────────────────── -->
    <section>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem;padding:0 .1rem;">
            <h3 style="font-size:.88rem;font-weight:700;color:#cbd5e1;">Atividades</h3>
            <span id="count-label" style="font-size:.72rem;color:#475569;">Carregando...</span>
        </div>
        <div id="lista-atividades" style="display:flex;flex-direction:column;gap:.65rem;">
            <!-- Skeletons -->
            <div class="skeleton" style="height:74px;"></div>
            <div class="skeleton" style="height:74px;"></div>
            <div class="skeleton" style="height:74px;"></div>
        </div>
    </section>

</main>

<!-- ══ Footer Fixo ═══════════════════════════════════════════════════ -->
<div class="glass-footer" style="position:fixed;bottom:0;left:0;right:0;padding:1rem 1.15rem 1.5rem;">
    <div style="max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:.75rem;">
        <!-- Progresso saque -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem;font-size:.75rem;">
            <span style="color:#64748b;">Progresso para próximo saque (min. R$ 50)</span>
            <span id="prog-label" style="font-weight:700;color:#25f4f4;">—</span>
        </div>
        <div class="prog-track">
            <div class="prog-fill" id="prog-fill" style="width:0%"></div>
        </div>
        <button class="btn-saque" id="btn-saque" onclick="solicitarSaque()" disabled>
            <span class="material-symbols-outlined">payments</span>
            <span id="btn-saque-txt">Solicitar Saque via Pix</span>
        </button>
    </div>
</div>

<script>
const SAQUE_MINIMO = 50;
let _todasIndicacoes = [];
let _saldoDisponivel = 0;
let _filtroAtivo = 'todos';

/* ── Formata R$ ── */
function fmtR(v) {
    return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
}

/* ── Mascara email ── */
function mascaraEmail(email) {
    if (!email) return '***';
    const [user, domain] = email.split('@');
    if (!user) return '***';
    const vis = user.slice(0, Math.min(3, user.length));
    return vis + '***' + (domain ? '@' + domain : '');
}

/* ── Formata data ── */
function fmtData(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' })
        + ' • ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

/* ── Renderiza lista ── */
function renderLista(items) {
    const el = document.getElementById('lista-atividades');
    document.getElementById('count-label').textContent = items.length + ' registro' + (items.length !== 1 ? 's' : '');

    if (!items.length) {
        el.innerHTML = `
            <div class="empty-state">
                <span class="material-symbols-outlined" style="color:#334155">receipt_long</span>
                <p style="font-size:.88rem;font-weight:600;color:#475569">Nenhuma atividade encontrada</p>
                <p style="font-size:.78rem;color:#334155;margin-top:.3rem">Compartilhe seu link para começar a ganhar!</p>
            </div>`;
        return;
    }

    el.innerHTML = items.map((ind, i) => {
        const pago    = !!ind.converteu;
        const email   = mascaraEmail(ind.indicado_email);
        const data    = fmtData(ind.created_at);
        const comissao = Number(ind.comissao || 0);
        const valorV   = Number(ind.valor_pago || 0);

        const icoClass  = pago   ? 'pago'    : 'pending';
        const icoName   = pago   ? 'check_circle' : 'pending';
        const icoColor  = pago   ? '#25f4f4' : '#fbbf24';
        const badgeClass = pago  ? 'badge-pago' : 'badge-pendente';
        const badgeText  = pago  ? 'Confirmada'  : 'Em Processamento';

        return `
        <div class="activity-item" style="animation-delay:${i * 0.05}s">
            <div class="ico-wrap ${icoClass}">
                <span class="material-symbols-outlined" style="font-size:1.2rem;color:${icoColor};font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">${icoName}</span>
            </div>
            <div style="flex:1;min-width:0;">
                <p style="font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${email}</p>
                <p style="font-size:.68rem;color:#475569;margin-top:.1rem">${data}</p>
            </div>
            <div style="text-align:right;flex-shrink:0;">
                ${valorV > 0 ? `<p style="font-size:.7rem;color:#64748b;">Venda ${fmtR(valorV)}</p>` : ''}
                <p style="font-size:.88rem;font-weight:800;color:#25f4f4;">${comissao > 0 ? '+ ' + fmtR(comissao) : '—'}</p>
                <span class="badge-status ${badgeClass}">${badgeText}</span>
            </div>
        </div>`;
    }).join('');
}

/* ── Filtrar ── */
function filtrar(tipo, btn) {
    _filtroAtivo = tipo;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    let items = _todasIndicacoes;
    if (tipo === 'converteu') items = items.filter(i => i.converteu);
    if (tipo === 'pendente')  items = items.filter(i => !i.converteu);
    renderLista(items);
}

/* ── Solicitar saque ── */
async function solicitarSaque() {
    const btn = document.getElementById('btn-saque');
    const txt = document.getElementById('btn-saque-txt');
    if (_saldoDisponivel < SAQUE_MINIMO) return;

    btn.disabled = true;
    txt.textContent = 'Processando...';

    try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) throw new Error('Não autenticado');

        const { error } = await sb.from('saques_afiliado').insert({
            user_id: user.id,
            valor:   _saldoDisponivel,
            status:  'pendente',
        });
        if (error) throw error;

        txt.textContent = 'Saque Solicitado! ✅';
        setTimeout(() => {
            txt.textContent = 'Solicitar Saque via Pix';
            btn.disabled = false;
        }, 3000);
    } catch(e) {
        console.error(e);
        txt.textContent = 'Erro — tente novamente';
        btn.disabled = false;
        setTimeout(() => { txt.textContent = 'Solicitar Saque via Pix'; }, 3000);
    }
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { location.href = 'login.html'; return; }

        // Busca afiliado
        const { data: afiliado } = await sb
            .from('afiliados')
            .select('id, total_ganhos, codigo')
            .eq('user_id', user.id)
            .maybeSingle();

        if (!afiliado) {
            document.getElementById('lista-atividades').innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-outlined" style="color:#334155">group_add</span>
                    <p style="font-size:.88rem;font-weight:600;color:#475569">Você ainda não é afiliado</p>
                    <p style="font-size:.78rem;color:#334155;margin-top:.3rem">Acesse "Indique e Ganhe" para se cadastrar.</p>
                </div>`;
            document.getElementById('count-label').textContent = '0 registros';
            ['total-ganhos','a-receber','total-vendas','total-pendentes'].forEach(id => {
                document.getElementById(id).textContent = '—';
            });
            document.getElementById('prog-label').textContent = fmtR(0) + ' / ' + fmtR(SAQUE_MINIMO);
            return;
        }

        // Busca indicações
        const { data: indicacoes } = await sb
            .from('indicacoes')
            .select('*')
            .eq('afiliado_id', afiliado.id)
            .order('created_at', { ascending: false });

        _todasIndicacoes = indicacoes || [];

        // Busca saques já solicitados
        const { data: saques } = await sb
            .from('saques_afiliado')
            .select('valor, status')
            .eq('user_id', user.id);

        const sacado = (saques || []).reduce((acc, s) => {
            if (s.status !== 'cancelado') acc += parseFloat(s.valor || 0);
            return acc;
        }, 0);

        const totalGanhos = parseFloat(afiliado.total_ganhos || 0);
        _saldoDisponivel  = Math.max(0, totalGanhos - sacado);

        const confirmadas = _todasIndicacoes.filter(i => i.converteu);
        const pendentes   = _todasIndicacoes.filter(i => !i.converteu);
        const totalComissao = confirmadas.reduce((a, i) => a + parseFloat(i.comissao || 0), 0);

        // Atualiza resumo
        document.getElementById('total-ganhos').textContent   = fmtR(totalComissao);
        document.getElementById('a-receber').textContent      = fmtR(_saldoDisponivel);
        document.getElementById('total-vendas').textContent   = confirmadas.length + ' venda' + (confirmadas.length !== 1 ? 's' : '');
        document.getElementById('total-pendentes').textContent = pendentes.length;

        // Progresso saque
        const pct = Math.min(100, (_saldoDisponivel / SAQUE_MINIMO) * 100);
        document.getElementById('prog-fill').style.width = pct + '%';
        document.getElementById('prog-label').textContent = fmtR(_saldoDisponivel) + ' / ' + fmtR(SAQUE_MINIMO);

        // Habilita botão se saldo suficiente
        const btnSaque = document.getElementById('btn-saque');
        if (_saldoDisponivel >= SAQUE_MINIMO) {
            btnSaque.disabled = false;
        } else {
            document.getElementById('btn-saque-txt').textContent =
                'Saldo insuficiente (mín. ' + fmtR(SAQUE_MINIMO) + ')';
        }

        // Renderiza lista
        renderLista(_todasIndicacoes);

    } catch(e) {
        console.error('[ExtratVendas]', e);
        document.getElementById('lista-atividades').innerHTML = `
            <div class="empty-state">
                <span class="material-symbols-outlined" style="color:#f87171">error</span>
                <p style="font-size:.88rem;font-weight:600;color:#f87171">Erro ao carregar dados</p>
            </div>`;
    }
});
</script>
</body>
</html>
