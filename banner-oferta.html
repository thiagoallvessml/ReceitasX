<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner Oferta Relâmpago — ReceitasX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══ BANNER VERTICAL ═══ */
        .banner {
            width: 420px;
            height: 720px;
            background: #0A0A0A;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 38px 24px 28px;
            gap: 20px;
            box-shadow: 0 0 80px rgba(251,191,36,.1);
        }

        /* Border Glow */
        .banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b, #ef4444, #f59e0b);
            background-size: 200% auto;
            animation: moveGradient 2s linear infinite;
        }

        @keyframes moveGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Ambient glowing spheres */
        .banner::after {
            content: '';
            position: absolute;
            top: -100px; left: 50%;
            transform: translateX(-50%);
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,158,11,.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .glow-red {
            position: absolute;
            bottom: -50px; right: -50px;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239,68,68,.08) 0%, transparent 60%);
            pointer-events: none;
        }

        /* ── Top Logo ── */
        .top {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .logo .cyan { color: #25f4f4; }
        .logo .white { color: #f1f5f9; }

        .divider {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
            margin: 5px 0;
            z-index: 2; position: relative;
        }

        /* ── Offer Section ── */
        .offer-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .badge-vitalicio {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(37,244,244,.1);
            border: 1px solid rgba(37,244,244,.3);
            color: #25f4f4;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 24px;
        }

        .title-relampago {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 30px;
            text-shadow: 0 4px 24px rgba(239,68,68,.4);
        }
        .title-relampago span {
            display: block;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .price-box {
            background: #141414;
            border: 2px solid #2A2A2A;
            border-radius: 20px;
            padding: 30px 40px;
            width: 100%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
        }

        .price-box::before {
            content: '';
            position: абсолют;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(135deg, #fbbf24, transparent 40%, transparent 60%, #ef4444);
            z-index: -1;
            opacity: 0.5;
        }

        .old-price {
            font-size: 24px;
            font-weight: 700;
            color: #64748b;
            text-decoration: line-through;
            text-decoration-color: #ef4444;
            text-decoration-thickness: 3px;
            margin-bottom: 5px;
        }

        .por-apenas {
            font-size: 14px;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: -5px;
        }

        .new-price {
            font-size: 78px;
            font-weight: 900;
            color: #34d399;
            line-height: 1;
            letter-spacing: -0.04em;
            text-shadow: 0 0 40px rgba(52,211,153,.3);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 4px;
        }
        .new-price-rs {
            font-size: 32px;
            margin-top: 10px;
        }

        .tag-desconto {
            position: absolute;
            top: -16px; right: -10px;
            background: #ef4444;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            padding: 6px 14px;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(239,68,68,.5);
            transform: rotate(5deg);
        }

        /* ── Bottom Section ── */
        .bottom-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 2;
            background: rgba(239,68,68,.1);
            border: 1px solid rgba(239,68,68,.3);
            border-radius: 16px;
            padding: 16px;
            margin-top: 10px;
        }

        .alert-live {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f1f5f9;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(239,68,68,0.7);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239,68,68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239,68,68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239,68,68, 0); }
        }

        .url {
            font-size: 26px;
            font-weight: 900;
            color: #25f4f4;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-shadow: 0 0 24px rgba(37,244,244,.4);
        }

        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 16px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,20,.9);
            border: 1px solid #1E1E1E;
            border-radius: 10px;
            padding: 8px 20px;
            color: #64748b;
            font-size: 11px;
            z-index: 100;
        }
        .instructions strong { color: #f59e0b; }
        .instructions kbd {
            background: #1E1E1E; border: 1px solid #2A2A2A;
            border-radius: 3px; padding: 1px 4px;
            font-size: 9px; color: #94a3b8;
        }
    </style>
    <script src="analytics.js"></script>
</head>
<body>

<div class="banner">
    <div class="glow-red"></div>

    <!-- ═══ TOP: Branding ═══ -->
    <div class="top">
        <div class="logo"><span class="cyan">Receitas</span><span class="white">X</span></div>
    </div>

    <div class="divider"></div>

    <!-- ═══ OFFER ═══ -->
    <div class="offer-wrap">
        <div class="badge-vitalicio">✨ Acesso Vitalício</div>
        
        <div class="title-relampago">
            Oferta
            <span>Relâmpago</span>
        </div>

        <div class="price-box">
            <div class="tag-desconto">-60% OFF</div>
            <div class="old-price">De R$ 49,90</div>
            <div class="por-apenas">Por Apenas</div>
            <div class="new-price">
                <span class="new-price-rs">R$</span>19,90
            </div>
            <div style="font-size:11px; color:#94a3b8; font-weight:600; margin-top:8px; text-transform:uppercase; letter-spacing:0.05em;">
                Pagamento Único
            </div>
        </div>
    </div>

    <!-- ═══ BOTTOM URL ═══ -->
    <div class="bottom-bar">
        <div class="alert-live">
            <div class="pulse-dot"></div>
            SOMENTE DURANTE A LIVE!
        </div>
        <span class="url">receitasx.com.br</span>
        <div class="cupom" style="font-size:17px;font-weight:800;color:#fbbf24;margin-top:2px;">
            Cupom: <span style="background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:6px;padding:3px 10px;margin-left:4px;">DOCECONE10</span>
        </div>
    </div>
</div>

<div class="instructions">
    📸 <strong>Para salvar:</strong> <kbd>Win</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> e selecione o banner para a sua Live
</div>

</body>
</html>
